name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no floating v10 tag since v8
      # --locked fails the job when uv.lock is out of date with pyproject.toml
      - run: uv sync --locked
      - run: uv run --frozen pytest -q

name: tag-release

# When main gets a version that has no tag yet, tag that commit as v<version>.
# Versions are bumped only in release PRs, so ordinary merges do nothing here.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read and compare versions
        id: ver
        run: |
          py_ver=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init_ver=$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('src/ncp_mcp/__init__.py').read()).group(1))")
          echo "pyproject=$py_ver __init__=$init_ver"
          if [ "$py_ver" != "$init_ver" ]; then
            echo "::error::version mismatch: pyproject.toml=$py_ver, src/ncp_mcp/__init__.py=$init_ver"
            exit 1
          fi
          echo "tag=v$py_ver" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists ($(git rev-list -n1 "$tag")); nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "created $tag at $GITHUB_SHA"

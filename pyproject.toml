[project]
name = "ncp-mcp"
version = "0.4.0"
description = "Lightweight MCP server for NAVER Cloud Platform: one signed generic API call tool instead of one tool per API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
]

[project.scripts]
ncp-mcp = "ncp_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncp_mcp"]

[tool.uv]
# uv.lock uses the lockfile format of uv 0.13; older uv would rewrite it.
required-version = ">=0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
